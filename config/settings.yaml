# Sleep History Bot - Configuration
# All tunable parameters for the pipeline

# ============================================================
# CHANNEL SETTINGS
# ============================================================
channel:
  name: "Sleep History"
  language: "en"
  target_duration_min: 22
  min_duration_min: 15
  max_duration_min: 30

# ============================================================
# TOPIC SETTINGS
# ============================================================
topics:
  file: "data/topics.txt"
  done_file: "data/done.txt"
  similarity_threshold: 0.85  # for duplicate detection (0-1)

# ============================================================
# SCRIPT SETTINGS
# ============================================================
script:
  sections: 8
  words_per_section: 700
  story_style: "documentary"  # "documentary" or "story" (second-person)
  welcome_section: true
  fade_out_section: true
  target_wpm: 140  # words per minute for sleep narration

# ============================================================
# AUDIO SETTINGS
# ============================================================
audio:
  tts_primary: "gemini"
  tts_fallback: "edge"
  gemini_voice: "Algieba"
  edge_voice: "en-US-GuyNeural"
  narration_style: "very slow, soft, warm, calm and soothing, with long gentle pauses between sentences"
  target_loudness: -16  # LUFS
  target_lra: 7
  target_tp: -1.5
  padding_end_seconds: 6
  chunk_size_chars: 2500
  sample_rate: 24000

# ============================================================
# TIMESTAMP SETTINGS
# ============================================================
timestamps:
  whisper_model: "base.en"
  whisper_device: "cpu"
  whisper_compute_type: "int8"
  min_alignment_ratio: 0.6
  fallback_to_estimated: true

# ============================================================
# VISUAL SETTINGS
# ============================================================
visual:
  image_seconds: 25
  shot_seconds: 9
  fps: 24
  resolution: [1920, 1080]
  crop_right: 0.15
  crop_bottom: 0.06
  crossfade_seconds: 1.2
  cut_fade_seconds: 0.35
  styles:
    cinematic: "dark moody cinematic photoreal film still, muted desaturated colours, dramatic low-key lighting, warm lantern glow, fine film grain, figures seen from behind or in silhouette or far away, no visible faces, no text, no watermark"
    manuscript: "medieval illuminated manuscript style illustration, flat gouache colours, small detailed figures, ornate decorative border, aged parchment, no text, no watermark"
    engraving: "black and white 19th century etching engraving illustration, fine crosshatching, aged paper, detailed, no text, no watermark"
  broll_every: 3
  embers_enabled: true
  three_d_enabled: true

# ============================================================
# IMAGE GENERATION SETTINGS
# ============================================================
images:
  primary: "pollinations"
  fallback: "gemini"
  pollinations_base_url: "https://image.pollinations.ai/prompt/"
  cache_enabled: true
  cache_dir: "data/cache/images"
  timeout_seconds: 60
  max_retries: 3

# ============================================================
# VIDEO ENCODING SETTINGS
# ============================================================
video:
  codec: "libx264"
  preset: "veryfast"
  crf: 23
  maxrate: "3500k"
  bufsize: "7M"
  colorspace: "bt709"
  color_primaries: "bt709"
  color_trc: "bt709"
  audio_codec: "aac"
  audio_bitrate: "160k"
  pixel_format: "yuv420p"
  movflags: "+faststart"

# ============================================================
# THUMBNAIL SETTINGS
# ============================================================
thumbnails:
  resolution: [1280, 720]
  variants: 3
  font_path: "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
  fallback_font: "DejaVuSans-Bold"

# ============================================================
# QUALITY GATES
# ============================================================
quality:
  min_duration_seconds: 900
  max_duration_seconds: 1800
  max_black_frames: 5
  max_silence_gaps: 3
  min_loudness_lufs: -18
  max_loudness_lufs: -14
  min_accuracy_score: 0.9
  min_originality_score: 0.95
  min_pacing_score: 0.8

# ============================================================
# PIPELINE SETTINGS
# ============================================================
pipeline:
  checkpoint_dir: "output/{topic_slug}/checkpoints"
  cleanup_temp: true
  retry_attempts: 3
  retry_base_delay: 15
  max_retry_delay: 180
  dry_run: false

# ============================================================
# GEMINI SETTINGS
# ============================================================
gemini:
  text_models:
    - "gemini-2.5-flash"
    - "gemini-2.0-flash"
    - "gemini-1.5-flash"
  tts_models:
    - "gemini-2.5-flash-preview-tts"
    - "gemini-2.0-flash-preview-tts"
  image_models:
    - "gemini-2.0-flash-preview-image-generation"
  max_tokens: 8192
  temperature: 0.7
  top_p: 0.9
