name: Make video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (leave empty to take the next one from topics.txt)"
        required: false
        default: ""
      sections:
        description: "Story sections (3 = quick test, 8 = ~45 min video)"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Build video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          SECTIONS: ${{ inputs.sections || '8' }}
        run: |
          for i in 1 2 3; do
            python make_video.py "$TOPIC" && exit 0
            echo "Attempt $i failed, waiting 3 minutes..."
            sleep 180
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/
          retention-days: 7
      - name: Save progress (done.txt)
        run: |
          touch done.txt
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add done.txt
          git diff --cached --quiet || (git commit -m "topic done" && git push)
