name: Make Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        type: choice
        default: full
        options:
          - full          # Run complete pipeline
          - research      # Topic selection only
          - script        # Script generation
          - audio         # TTS generation
          - timestamps    # Whisper alignment
          - visual        # Image generation
          - video         # Video rendering
          - publish       # Metadata + quality checks
          - plan          # Generate prompts list for manual creation
          - assemble      # Build video from user media
      topic:
        description: "Topic (empty = next from topics.txt)"
        required: false
        default: ""
      resume_from:
        description: "Stage to resume from (for full mode)"
        required: false
        default: ""
      stages:
        description: "Comma-separated stages to run (for full mode)"
        required: false
        default: ""
      plan_dir:
        description: "Plan directory for assemble mode"
        required: false
        default: ""
      force:
        description: "Force re-run stages even if completed"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need history for done.txt
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Install ML dependencies (for video stage 3D depth)
        if: ${{ inputs.mode != 'research' && inputs.mode != 'script' && inputs.mode != 'plan' }}
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers
      
      - name: Restore checkpoint artifact
        if: ${{ inputs.mode == 'full' && inputs.resume_from != '' }}
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-${{ inputs.resume_from }}
          path: output/
      
      - name: Download plan artifact for assemble
        if: ${{ inputs.mode == 'assemble' }}
        uses: actions/download-artifact@v4
        with:
          name: output
          path: plan_in
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      
      - name: Run Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODE="${{ inputs.mode }}"
          TOPIC="${{ inputs.topic }}"
          RESUME_FROM="${{ inputs.resume_from }}"
          STAGES="${{ inputs.stages }}"
          PLAN_DIR="${{ inputs.plan_dir }}"
          
          CMD="python main.py $MODE --output output"
          if [ -n "$TOPIC" ]; then
            CMD="$CMD --topic \"$TOPIC\""
          fi
          if [ -n "$RESUME_FROM" ]; then
            CMD="$CMD --resume-from $RESUME_FROM"
          fi
          if [ -n "$STAGES" ]; then
            CMD="$CMD --stages $STAGES"
          fi
          if [ -n "$PLAN_DIR" ]; then
            CMD="$CMD --plan-dir $PLAN_DIR"
          fi
          echo "Running: $CMD"
          
          # Retry logic
          for i in 1 2 3; do
            eval $CMD && exit 0
            echo "Attempt $i failed, waiting 3 minutes..."
            sleep 180
          done
          exit 1
      
      - name: Upload checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-${{ github.run_id }}
          path: output/**/checkpoints/
          retention-days: 30
      
      - name: Upload output artifact
        if: ${{ inputs.mode == 'full' || inputs.mode == 'video' || inputs.mode == 'publish' || inputs.mode == 'plan' || inputs.mode == 'assemble' }}
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
          retention-days: 30
      
      - name: Save progress and clear media
        if: ${{ inputs.mode == 'full' || inputs.mode == 'publish' || inputs.mode == 'assemble' }}
        run: |
          touch done.txt
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add done.txt
          if [ "${{ inputs.mode }}" = "full" ] || [ "${{ inputs.mode }}" = "assemble" ]; then
            git ls-files media | grep -v '^media/README.txt$' | xargs -r -d '\n' git rm -q -f 2>/dev/null || true
          fi
          git diff --cached --quiet || (git commit -m "progress: ${{ inputs.topic || 'auto' }}" && git push)
